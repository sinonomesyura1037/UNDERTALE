<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MONSTER ARCHIVE</title>

<style>

@font-face {
    font-family: "JF";
    src: url("JF-Dot-K14.ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "JF", monospace;
    font-size: 16px;
}

.container {
    width: min(900px, 94%);
    margin: 0 auto;
    padding: 35px 0 80px;
}

/* =========================
   タイトル
========================= */

.logo {
    text-align: center;
    font-size: 42px;
    color: #ffb000;
    margin-bottom: 12px;
    letter-spacing: 2px;
}

.description {
    border: 2px solid #fff;
    padding: 18px;
    line-height: 1.8;
    margin-bottom: 25px;
}

/* =========================
   検索
========================= */

.search-box {
    margin-bottom: 15px;
}

.search-box input {
    width: 100%;
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 12px;
    font-family: "JF", monospace;
    font-size: 18px;
    outline: none;
}

.search-box input:focus {
    border-color: #ffb000;
}

/* =========================
   モンスター一覧
========================= */

.monster-list {
    height: 190px;
    overflow-y: auto;
    border: 2px solid #fff;
    padding: 8px;
    margin-bottom: 30px;
}

.monster-name {
    display: block;
    color: #fff;
    text-decoration: none;
    padding: 9px 12px;
    margin-bottom: 3px;
}

.monster-name:hover {
    background: #222;
    color: #ffb000;
}

.monster-name::before {
    content: "♥ ";
    color: #ff3030;
}

/* =========================
   詳細
========================= */

.detail {
    border-top: 3px solid #ffb000;
    padding-top: 30px;
}

.detail-title {
    color: #ffb000;
    font-size: 34px;
    margin-bottom: 15px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.badge {
    border: 2px solid #fff;
    padding: 7px 12px;
}

.badge span {
    color: #ffb000;
}

/* =========================
   モンスター画像
========================= */

.monster-image-box {
    border: 2px solid #fff;
    min-height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    margin-bottom: 25px;
}

.monster-image-box img {
    max-width: 100%;
    max-height: 260px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

.no-image {
    color: #777;
}

/* =========================
   ステータス
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.stat {
    border: 2px solid #555;
    padding: 14px;
}

.stat-label {
    color: #aaa;
    margin-bottom: 6px;
}

.stat-value {
    color: #fff;
    font-size: 22px;
}

/* =========================
   説明
========================= */

.info-box {
    border: 2px solid #fff;
    padding: 18px;
    margin-bottom: 15px;
    line-height: 1.8;
}

.info-title {
    color: #ffb000;
    font-size: 22px;
    margin-bottom: 8px;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .container {
        width: 92%;
        padding-top: 25px;
    }

    .logo {
        font-size: 30px;
    }

    .detail-title {
        font-size: 27px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        MONSTER ARCHIVE
    </div>

    <div class="description">
        このページはモンスターの情報を記録した図鑑です。<br>
        左側の一覧からモンスターを選択すると、詳細情報を確認できます。
    </div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="モンスターを検索..."
        >
    </div>

    <div
        class="monster-list"
        id="monsterList">
    </div>

    <div
        class="detail"
        id="detail">
    </div>

</div>

<!--
=========================================================
モンスターデータ
=========================================================
ここは触らなくてOK。

モンスターの追加・編集は
「monster-data.js」を編集してください。
=========================================================
-->

<script src="monster-data.js"></script>

<script>

const monsterList = document.getElementById("monsterList");
const detail = document.getElementById("detail");
const search = document.getElementById("search");


/* =========================================
   モンスター名をIDに変換
========================================= */

function makeId(name) {

    return name
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

}


/* =========================================
   一覧表示
========================================= */

function showList(keyword = "") {

    monsterList.innerHTML = "";

    monsters
        .filter(monster =>
            monster.name
                .toLowerCase()
                .includes(keyword.toLowerCase())
        )
        .forEach(monster => {

            const link = document.createElement("a");

            link.className = "monster-name";
            link.href = "#" + makeId(monster.name);
            link.textContent = monster.name;

            monsterList.appendChild(link);

        });

}


/* =========================================
   詳細表示
========================================= */

function showMonster(monster) {

    const id = makeId(monster.name);

    detail.id = id;

    detail.innerHTML = `

        <div class="detail-title">
            ${escapeHTML(monster.name)}
        </div>

        <div class="badges">

            <div class="badge">
                種類：
                <span>${escapeHTML(monster.type)}</span>
            </div>

            <div class="badge">
                出現場所：
                <span>${escapeHTML(monster.location)}</span>
            </div>

        </div>


        <div class="monster-image-box">

            ${
                monster.image
                ?
                `
                <img
                    src="${escapeAttribute(monster.image)}"
                    alt="${escapeAttribute(monster.name)}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                >
                <div class="no-image" style="display:none;">
                    画像がありません
                </div>
                `
                :
                `
                <div class="no-image">
                    画像がありません
                </div>
                `
            }

        </div>


        <div class="stats">

            <div class="stat">
                <div class="stat-label">HP</div>
                <div class="stat-value">${monster.hp}</div>
            </div>

            <div class="stat">
                <div class="stat-label">攻撃力</div>
                <div class="stat-value">${monster.atk}</div>
            </div>

            <div class="stat">
                <div class="stat-label">防御力</div>
                <div class="stat-value">${monster.def}</div>
            </div>

            <div class="stat">
                <div class="stat-label">EXP</div>
                <div class="stat-value">${monster.exp}</div>
            </div>

            <div class="stat">
                <div class="stat-label">G</div>
                <div class="stat-value">${monster.gold}</div>
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                分析
            </div>

            <div>
                ${escapeHTML(monster.analysis)}
            </div>

        </div>


        <div class="info-box">

            <div class="info-title">
                逃がす方法
            </div>

            <div>
                ${escapeHTML(monster.spare)}
            </div>

        </div>

    `;

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =========================================
   クリック処理
========================================= */

monsterList.addEventListener("click", function(event) {

    const link = event.target.closest(".monster-name");

    if (!link) return;

    const id = link.getAttribute("href").substring(1);

    const monster = monsters.find(
        monster => makeId(monster.name) === id
    );

    if (monster) {

        showMonster(monster);

    }

});


/* =========================================
   検索
========================================= */

search.addEventListener("input", function() {

    showList(search.value);

});


/* =========================================
   初期表示
========================================= */

showList();

if (monsters.length > 0) {

    showMonster(monsters[0]);

}

</script>

</body>
</html>
